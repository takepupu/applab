<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#165e50"><title>何でもスタンプラリー | 試作版</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#192a26;font:15px/1.55 -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}header{background:#165e50;color:white;padding:17px 18px 13px}header h1{font-size:21px;margin:0;letter-spacing:.03em}header small{opacity:.85}main{max-width:850px;margin:auto;padding:12px 14px 45px}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#e4eee8;color:#164d42;font-weight:650;min-height:44px}button.primary{background:#165e50;color:white}button:disabled{opacity:.5;cursor:default}select,input{border:1px solid #cbd8d0;border-radius:9px;padding:10px;background:white;min-width:0;color:#192a26}select{flex:1}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.panel{background:white;padding:13px;border:1px solid #dce5df;border-radius:14px;margin:10px 0}.progress{height:8px;background:#e8eeea;border-radius:12px;overflow:hidden}.progress div{height:100%;background:#259b7c;transition:width .25s}.muted{color:#5e7068;font-size:13px}#map{height:clamp(300px,48vh,510px);border-radius:14px;background:#e0e8df;z-index:0}.pin{display:grid;place-items:center;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);color:white;background:#9c6331;border:2px solid white;box-shadow:0 2px 5px #0005;font-weight:bold;font-size:17px}.pin span{transform:rotate(45deg)}.pin.done{background:#168260}.item{padding:12px 0;display:flex;align-items:center;gap:11px;border-top:1px solid #e8eeea}.item:first-child{border-top:0}.item strong{display:block}.stamp{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;border:2px dashed #b5c2b9;color:#8c9c94;font-size:19px}.stamp.done{background:#e2f2e9;color:#167353;border:2px solid #167353}.item .body{flex:1}.item button{font-size:12px}.title{font-size:16px;font-weight:750;margin:0 0 8px}.note{font-size:12px;color:#62746c}.status{min-height:23px;font-size:13px;margin:6px 0;color:#165e50}details summary{cursor:pointer;font-weight:700}details input{width:100%;margin-top:8px}#addForm{display:none}#addForm.visible{display:block}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}#map .leaflet-control-attribution{font-size:10px}.leaflet-popup-content button{margin-top:5px}footer{font-size:12px;color:#65746b;text-align:center;margin-top:18px}
</style></head><body><header><h1>何でもスタンプラリー</h1><small>いつもの街を、集める旅に。</small></header><main><div class="row"><select id="theme" aria-label="ラリー選択"></select><button id="newTheme">＋ ラリー</button></div><section class="panel"><div class="row" style="justify-content:space-between"><strong id="count">0 / 0 スポット</strong><span id="percent" class="muted">0%</span></div><div class="progress" role="progressbar" aria-label="達成率" aria-valuemin="0" aria-valuemax="100"><div id="bar"></div></div></section><div id="map" aria-label="スポット地図"></div><div class="actions"><button id="loc" class="primary">◎ 現在地を取得</button><button id="add">＋ 地図から地点追加</button><button id="near">近い順に表示</button></div><div id="status" class="status" aria-live="polite"></div><section class="panel" id="addForm"><div class="title">地点を登録</div><div class="muted">地図をタップして場所を選択</div><input id="spotName" maxlength="100" placeholder="スポット名" style="width:100%;margin-top:8px"><div id="coords" class="muted"></div><div class="actions"><button id="save" class="primary">登録</button><button id="cancel">キャンセル</button></div></section><section class="panel"><h2 class="title">スタンプ帳</h2><div id="list"></div></section><details class="panel"><summary>データ管理・使い方</summary><p class="note">地図の地点を登録し、現地でチェックインを押します。試作版の判定は距離50m以内・位置精度30m以内。端末の位置情報許可が必要です。記録はこのブラウザ内だけに保存されます。</p><div class="actions"><button id="export">JSON書き出し</button><button id="importBtn">JSON読み込み</button><input type="file" id="import" accept="application/json,.json" hidden style="display:none"></div><p class="note">試作版ではサーバーへの位置情報送信・アカウント登録・ランキングはありません。地図・ライブラリ読み込みには通信が必要です。</p></details><footer>Prototype · 地図の出典：国土地理院</footer></main><script>
'use strict';const $=id=>document.getElementById(id);const KEY='nandemo-stamp-v1';const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const initial={active:'saka',themes:[{id:'saka',name:'坂道めぐり',spots:[]},{id:'jisha',name:'神社・お寺めぐり',spots:[]}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial}catch(e){db=initial}let pos=null,pending=null,adding=false,sortNear=false,markers=null,locLayer=null,pendingLayer=null,map=null;function msg(t){$('status').textContent=t}function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){msg('端末への保存に失敗しました。JSONで書き出してください。')}}function theme(){return db.themes.find(x=>x.id===db.active)||db.themes[0]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dist(a,b){const r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 6371000*2*Math.asin(Math.sqrt(Math.min(1,h)))}function dtext(n){return n<1000?Math.round(n)+'m':(n/1000).toFixed(1)+'km'}function readGPS(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('位置情報非対応'));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),rej,{enableHighAccuracy:true,maximumAge:0,timeout:15000})})}function setPosition(p,center){pos=p;if(map){if(locLayer)locLayer.remove();locLayer=L.layerGroup([L.circle([p.lat,p.lng],{radius:p.accuracy,color:'#2688cf',weight:1,fillOpacity:.12}),L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:'#2688cf',fillOpacity:1})]).addTo(map);if(center)map.setView([p.lat,p.lng],16)}render()}function render(){const t=theme();$('theme').replaceChildren(...db.themes.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;o.selected=x.id===t.id;return o}));let completed=t.spots.filter(s=>s.checked).length,pct=t.spots.length?Math.round(completed/t.spots.length*100):0;$('count').textContent=`${completed} / ${t.spots.length} スポット`;$('percent').textContent=pct+'%';$('bar').style.width=pct+'%';$('bar').parentElement.setAttribute('aria-valuenow',pct);let spots=[...t.spots];if(sortNear&&pos)spots.sort((a,b)=>dist(pos,a)-dist(pos,b));$('list').replaceChildren();if(!spots.length){$('list').textContent='まだ地点がありません。地図から最初のスポットを追加してください。'}if(markers)markers.clearLayers();for(const s of spots){const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="stamp ${s.checked?'done':''}">${s.checked?'✓':'○'}</div><div class="body"><strong>${esc(s.name)}</strong><div class="muted">${s.checked?'獲得 '+esc(new Date(s.checked).toLocaleDateString('ja-JP')):pos?'直線距離 '+dtext(dist(pos,s)):'未獲得'}</div></div>`;const b=document.createElement('button');b.textContent=s.checked?'地図':'チェックイン';b.onclick=()=>s.checked?focus(s):check(t.id,s.id);el.append(b);const edit=document.createElement('button');edit.textContent='⋯';edit.setAttribute('aria-label',s.name+'の管理');edit.onclick=()=>{if(confirm(s.name+' を削除しますか？（獲得記録も削除されます）')){t.spots=t.spots.filter(x=>x.id!==s.id);persist();render()}};el.append(edit);el.querySelector('.body').onclick=()=>focus(s);$('list').append(el);if(markers){const icon=L.divIcon({className:'',html:`<div class="pin ${s.checked?'done':''}" style="width:32px;height:32px"><span>${s.checked?'✓':'•'}</span></div>`,iconSize:[32,32],iconAnchor:[16,32]});const m=L.marker([s.lat,s.lng],{icon}).addTo(markers);const pop=document.createElement('div');const name=document.createElement('strong');name.textContent=s.name;pop.append(name);if(!s.checked){const btn=document.createElement('button');btn.className='primary';btn.textContent='チェックイン';btn.onclick=()=>check(t.id,s.id);pop.append(document.createElement('br'),btn)}m.bindPopup(pop)}}}function focus(s){if(map){map.setView([s.lat,s.lng],17);window.scrollTo({top:0,behavior:'smooth'})}}async function check(tid,sid){const t=db.themes.find(x=>x.id===tid),s=t?.spots.find(x=>x.id===sid);if(!s||s.checked)return;msg('新しい現在地を測定しています…');try{const p=await readGPS();setPosition(p,false);if(!db.themes.find(x=>x.id===tid)?.spots.includes(s))return;const d=dist(p,s);if(p.accuracy>30){msg(`位置精度が約${Math.round(p.accuracy)}mです。空の開けた安全な場所で再試行してください。`);return}if(d>50){msg(`あと直線距離 ${dtext(d)}。チェックインには50m以内が必要です。`);return}s.checked=new Date().toISOString();persist();render();msg('★ '+s.name+' のスタンプを獲得！ '+(t.spots.every(x=>x.checked)?'コンプリート達成！':''))}catch(e){msg('位置情報を取得できません。HTTPSのページで位置情報を許可し、再試行してください。')}}function endAdd(){adding=false;pending=null;if(pendingLayer)pendingLayer.remove();pendingLayer=null;$('addForm').classList.remove('visible');$('add').textContent='＋ 地図から地点追加'}function beginAdd(){if(!map){msg('地図が読み込めません。通信を確認してください。');return}if(adding){endAdd();return}adding=true;$('addForm').classList.add('visible');$('spotName').value='';$('coords').textContent='地点未選択';$('add').textContent='追加を終了';msg('地図上の安全に立ち入れる場所をタップしてください。')}function fit(){const s=theme().spots;if(map&&s.length)map.fitBounds(s.map(x=>[x.lat,x.lng]),{padding:[35,35],maxZoom:16})}try{if(window.L){map=L.map('map').setView([35.4437,139.638],13);L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'}).addTo(map);markers=L.layerGroup().addTo(map);map.on('click',e=>{if(!adding)return;pending={lat:e.latlng.lat,lng:e.latlng.lng};if(pendingLayer)pendingLayer.remove();pendingLayer=L.circleMarker(e.latlng,{radius:10,color:'#165e50',fillColor:'#e5bc52',fillOpacity:1}).addTo(map);$('coords').textContent=pending.lat.toFixed(6)+', '+pending.lng.toFixed(6)})}else msg('地図ライブラリを読み込めません。通信を確認してください。')}catch(e){msg('地図の初期化に失敗しました。')}
$('theme').onchange=()=>{endAdd();db.active=$('theme').value;persist();render();fit()};$('newTheme').onclick=()=>{const n=prompt('新しいラリーの名前');if(!n?.trim())return;endAdd();const t={id:uid(),name:n.trim().slice(0,100),spots:[]};db.themes.push(t);db.active=t.id;persist();render()};$('loc').onclick=async()=>{const b=$('loc');b.disabled=true;msg('現在地を取得しています…');try{const p=await readGPS();setPosition(p,true);msg('位置精度：約'+Math.round(p.accuracy)+'m')}catch(e){msg('位置情報を取得できません。HTTPSで公開し位置情報を許可してください。')}finally{b.disabled=false}};$('near').onclick=()=>{if(!pos){msg('先に現在地を取得してください。');return}sortNear=!sortNear;$('near').textContent=sortNear?'登録順に表示':'近い順に表示';render()};$('add').onclick=beginAdd;$('cancel').onclick=endAdd;$('save').onclick=()=>{const n=$('spotName').value.trim();if(!n||!pending){msg('スポット名と地図の地点を指定してください。');return}theme().spots.push({id:uid(),name:n,...pending,checked:null});endAdd();persist();render();msg(n+' を登録しました。')};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='stamp-rallies.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('import').click();$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f)return;const v=JSON.parse(await f.text());if(!Array.isArray(v.themes)||!v.themes.length||!v.themes.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&Array.isArray(t.spots)&&t.spots.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&Number.isFinite(s.lat)&&Number.isFinite(s.lng)&&Math.abs(s.lat)<=90&&Math.abs(s.lng)<=180&&(!s.checked||!isNaN(Date.parse(s.checked))))))throw Error();if(!confirm('現在のデータを読み込んだデータで置き換えますか？'))return;endAdd();db=v;db.active=theme().id;persist();render();fit();msg('データを読み込みました。')}catch(e){msg('JSONファイルの形式が正しくありません。')}finally{$('import').value=''}};render();fit();
</script></body></html>
